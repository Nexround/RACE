[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "race"
version = "0.1.0"
description = "Core RACE algorithms and HDF5 IO for language models"
license = "MIT"
authors = [{ name = "RACE Team" }]
keywords = [
    "machine learning",
    "neural networks",
    "interpretability",
    "neuron analysis",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21.0",
    "torch",
    "h5py>=3.7.0",
    "scipy>=1.15.3",
    "tqdm>=4.64.0",
]

[project.optional-dependencies]
llm = [
    "accelerate>=1.10.0",
    "datasets>=4.0.0",
    "huggingface-hub>=0.34.4",
    "transformers==4.57.6",
]
all = ["race[llm]"]

[project.urls]
Homepage = "https://github.com/Nexround/RACE"
Repository = "https://github.com/Nexround/RACE"
Documentation = "https://github.com/Nexround/RACE/blob/main/docs/method.md"
Issues = "https://github.com/Nexround/RACE/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["race*"]

[tool.setuptools.package-data]
race = ["py.typed"]
